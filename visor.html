<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
        <link rel="icon" type="image/x-icon" id="favicon-logo" href="img/logopng1.png">
        <title>Catálogo - Monse Artículos Personalizados</title>
        
        <!-- Bootstrap CSS e Iconos -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        
        <!-- Estilos personalizados -->
        <link rel="stylesheet" href="styles.css">
        
        <!-- Librería PDF.js -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <script>
            if (!document.referrer.includes(window.location.hostname)) {
                window.location.href = "/";
            }
        </script>
    </head>
    <body>

        <!-- Barra de Navegación Superior -->
        <header class="toolbar shadow-sm py-2">
            <div class="container-fluid">
                <div class="row align-items-center">
                    
                    <!-- Logo -->
                    <div class="col-4 d-flex align-items-center">
                        <img id="navbar-logo" src="img/logopng1.png" alt="Logo Monse" class="d-inline-block align-text-top" style="height: 35px;">
                    </div>

                    <!-- Controles de Páginas -->
                    <div class="col-4 d-flex justify-content-center align-items-center gap-1 gap-md-2">
                        <button id="firstBtn" class="btn btn-outline-secondary btn-sm" title="Ir al Inicio"><i class="bi bi-chevron-double-left"></i><span class="d-none d-sm-inline ms-1">Inicio</span></button>
                        <button id="prevBtn" class="btn btn-outline-secondary btn-sm"><i class="bi bi-chevron-left"></i><span class="d-none d-sm-inline ms-1">Anterior</span></button>
                        
                        <span class="badge bg-secondary px-2 py-2 fs-6">
                            <span id="pageNum">1</span> / <span id="pageCount">--</span>
                        </span>
                        
                        <button id="nextBtn" class="btn btn-outline-secondary btn-sm"><span class="d-none d-sm-inline me-1">Siguiente</span><i class="bi bi-chevron-right"></i></button>
                        <button id="lastBtn" class="btn btn-outline-secondary btn-sm" title="Ir al Final"><span class="d-none d-sm-inline me-1">Final</span><i class="bi bi-chevron-double-right"></i></button>
                    </div>

                    <!-- Botón de Salir -->
                    <div class="col-4 d-flex justify-content-end align-items-center">
                        <a href="index.html" class="btn-exit-x shadow-sm" title="Salir al Inicio">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>

                </div>
            </div>
        </header>

        <!-- Contenedor del Visor PDF -->
        <div class="viewer-container">
            
            <!-- Indicador de Carga -->
            <div id="loadingSpinner">
                <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
                <p class="text-muted small">Cargando catálogo...</p>
            </div>

            <!-- Mensaje de Error -->
            <div id="errorMessage" class="alert alert-danger text-center shadow p-3">
                <i class="bi bi-exclamation-triangle-fill fs-2 d-block mb-2"></i>
                <h5 class="fw-bold fs-6">No se pudo cargar el catálogo</h5>
                <p id="errorText" class="small mb-3">Error al intentar leer el archivo PDF.</p>
                <button onclick="location.reload()" class="btn btn-sm btn-outline-danger me-2">Reintentar</button>
                <a href="CATALOGO.pdf" target="_blank" class="btn btn-sm btn-danger">Abrir PDF directo</a>
            </div>

            <!-- Lienzo de Renderizado -->
            <canvas id="pdfCanvas"></canvas>
        </div>

        <!-- Bootstrap Bundle JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Motor de Visualización PDF.js -->
        <script>
            const pdfPath = 'CATALOGO.pdf';

            let pdfDoc = null,
                pageNum = 1,
                pageRendering = false,
                pageNumPending = null,
                canvas = document.getElementById('pdfCanvas'),
                ctx = canvas.getContext('2d');

            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }

            function showError(msg) {
                document.getElementById('loadingSpinner').style.display = 'none';
                canvas.style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorText').innerText = msg;
            }

            if (typeof pdfjsLib === 'undefined') {
                showError('No se pudo conectar con la librería del visor (PDF.js).');
            } else {
                pdfjsLib.getDocument(pdfPath).promise.then(function(pdfDoc_) {
                    pdfDoc = pdfDoc_;
                    document.getElementById('pageCount').textContent = pdfDoc.numPages;
                    
                    document.getElementById('loadingSpinner').style.display = 'none';
                    canvas.style.display = 'block';
                    
                    renderPage(pageNum);
                }).catch(function(err) {
                    console.error('Error al cargar PDF:', err);
                    if (window.location.protocol === 'file:') {
                        showError('Estás abriendo el archivo localmente (file://). Usa "Live Server" en VS Code.');
                    } else {
                        showError('No se encontró el archivo "' + pdfPath + '". Revisa que esté en la misma carpeta.');
                    }
                });
            }

            function renderPage(num) {
                pageRendering = true;
                pdfDoc.getPage(num).then(function(page) {
                    const container = document.querySelector('.viewer-container');
                    const unscaledViewport = page.getViewport({ scale: 1.0 });
                    
                    const hScale = (container.clientHeight - 20) / unscaledViewport.height;
                    const wScale = (container.clientWidth - 20) / unscaledViewport.width;
                    let dynamicScale = Math.min(hScale, wScale);
                    
                    if (isNaN(dynamicScale) || dynamicScale <= 0) {
                        dynamicScale = 1.3;
                    }

                    const MAX_SCALE = 1.5;
                    if (dynamicScale > MAX_SCALE) {
                        dynamicScale = MAX_SCALE;
                    }

                    let viewport = page.getViewport({ scale: dynamicScale });
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    let renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };
                    
                    let renderTask = page.render(renderContext);

                    renderTask.promise.then(function() {
                        pageRendering = false;
                        if (pageNumPending !== null) {
                            let nextNum = pageNumPending;
                            pageNumPending = null;
                            renderPage(nextNum);
                        }
                    }).catch(function(err) {
                        pageRendering = false;
                        console.warn('Renderizado interrumpido o cambiado:', err);
                    });
                });
                document.getElementById('pageNum').textContent = num;
            }

            function queueRenderPage(num) {
                if (pageRendering) {
                    pageNumPending = num;
                } else {
                    renderPage(num);
                }
            }

            // Eventos de Navegación
            document.getElementById('firstBtn').addEventListener('click', function() {
                if (!pdfDoc || pageNum === 1) return;
                pageNum = 1;
                queueRenderPage(pageNum);
            });

            document.getElementById('prevBtn').addEventListener('click', function() {
                if (pageNum <= 1) return;
                pageNum--;
                queueRenderPage(pageNum);
            });

            document.getElementById('nextBtn').addEventListener('click', function() {
                if (!pdfDoc || pageNum >= pdfDoc.numPages) return;
                pageNum++;
                queueRenderPage(pageNum);
            });

            document.getElementById('lastBtn').addEventListener('click', function() {
                if (!pdfDoc) return;
                pageNum = pdfDoc.numPages;
                queueRenderPage(pageNum);
            });

            // Ajustar escala al redimensionar ventana
            window.addEventListener('resize', function() {
                if (pdfDoc) {
                    renderPage(pageNum);
                }
            });

            // Navegación mediante teclado (Flechas y Espacio)
            document.addEventListener('keydown', function(e) {
                if (!pdfDoc) return;
                if (e.key === 'ArrowRight' || e.key === 'Space') {
                    if (pageNum < pdfDoc.numPages) { pageNum++; queueRenderPage(pageNum); }
                } else if (e.key === 'ArrowLeft') {
                    if (pageNum > 1) { pageNum--; queueRenderPage(pageNum); }
                }
            });
        </script>

        <!-- Script Global (Tema y Preferencias) -->
        <script src="global.js"></script>
    </body>
</html>
